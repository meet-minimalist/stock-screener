name: Refresh BSE-only Universe

# Monthly rebuild of the BSE-exclusive ticker list (companies listed on the BSE
# but not the NSE). Uses only PUBLIC sources — BSE's ListofScripData JSON API and
# NSE's full equity list — so no private module or secret is needed. The cached
# CSV is committed back and reused by the (weekly) India fundamentals refresh.
on:
  schedule:
    - cron: "0 5 1 * *"     # 1st of each month, 05:00 UTC (10:30 IST)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pandas>=2.0" requests

      - name: Rebuild BSE-only ticker list
        run: python -m screener.data.bse --refresh --verbose

      - name: Commit ticker list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/tickers/bse_only.csv data/tickers/nse_equity_full.csv
          if git diff --cached --quiet; then
            echo "No BSE universe changes to commit."
          else
            git commit -m "chore(data): monthly BSE-only universe refresh"
            git push
          fi
